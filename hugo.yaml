baseURL: https://red-ace3333.github.io/site1/
languageCode: zh-cn
theme: reimu
title: 我的博客
copyright: "red-ace3333"

# 语言配置
DefaultContentLanguage: zh-cn

# 设置为true以支持中文内容的正确摘要和字数统计
hasCJKLanguage: true

# ⭐ URL 修正（GitHub Pages 部署在 /site1/ 子路径下必开）
#
# canonical / relative 的取舍踩坑记录：
#   ✗ relativeURLs=true —— Hugo 会把所有 HTML/CSS 中以 / 开头的绝对路径（包括已经带
#       /site1/ 前缀的 .RelPermalink，如 `/site1/js/main.js`）也强制做相对化，
#       输出 `../../site1/js/main.js`，结果浏览器在 /site1/post/分享/ 下 resolve
#       变成 `/site1/site1/js/main.js`（双前缀）→ JS/CSS 全站 404 💥。
#   ✗ canonifyURLs=true —— 把 href/src 都换成绝对 URL，不利于切域名/预览。
#
# ✅ 本项目的正确配置：relativeURLs=false, canonifyURLs=false
#   Markdown 中作者可能写的「无前域名 /images/posts/分享/1.jpg」绝对路径，
#   由 layouts/_default/_markup/render-image.html 和 render-link.html
#   这两个 Goldmark render hooks 里的 `| relURL` 单独处理 ——
#   精准只在 Markdown 层做修正，不与 .RelPermalink 打架。
relativeURLs: false
canonifyURLs: false

# 日期时间格式
dateFormat: "2006-01-02"
timeFormat: "2006-01-02 15:04:05"

# 内容设置
contentDir: "content"

# 主要内容部分
mainSections: ["post"]

# 菜单配置
menu:
  main:
    - name: home
      url: ""
      icon: 
    - name: archives
      url: "archives"
      icon: 
    - name: about
      url: "about"
      icon: 
    - name: friend
      url: "friend"
      icon: 

params:
  # 基本配置
  author: "red-ace3333"
  description: "我的个人博客"
  keywords: "博客,技术,生活"
  subtitle: "我的个人博客"

  # ⭐ 侧边栏头像 + 站点 Banner（修复 404 + 「banner 变成用户头像」）
  # 2026-09-01 踩坑记录：之前 banner.jpg 是从头像 jpg 直接复制的同一张图，
  #   导致文章顶、首页卡片等位置都显示用户大脸头像。现改为新生成的
  #   16:9 轻奢米金大理石风 PNG（本地生成、无第三方依赖）。
  #   static/avatar/avatar.jpg     → 用户头像（不动）
  #   static/images/banner.png     → 新横幅 (1920×1080)
  # 以后换头像/换横幅：新文件覆盖同名路径 + 改后缀即可
  avatar: "avatar.jpg"
  banner: "images/banner.png"
  
  # 侧边栏配置
  sidebar: right

  # 小部件配置
  widgets:
    - category
    - tag
    - tagcloud
    - recent_posts

  # 小部件行为
  category_limits: 10
  tag_limits: 10
  recent_posts_limits: 5
  tagcloud_limits: 20
  
  # 页脚配置
  footer:
    since: 2025
    powered: true
    count: true
    busuanzi: true
  
  # 代码块配置
  code_block:
    expand: true
  
  # 数学公式配置
  math:
    katex:
      enable: true
    mathjax:
      enable: false
  
  # 动画配置
  animation:
    enable: true
  
  # 加载器配置
  preloader:
    enable: true
  
  # 回到顶部配置
  top:
    enable: true
    position: right
  
  # Pace进度条
  pace:
    enable: true
  
  # 暗模式配置
  dark_mode:
    enable: "auto"
  
  # 评论系统配置
  comment:
    default: waline
  
  # Waline评论系统配置
  waline:
    enable: false
    serverURL: ""  # TODO: 部署后填入自己的 Waline 服务地址，如 https://your-waline.vercel.app
    pageview: true
    emoji:
      - https://unpkg.com/@waline/emojis@1.2.0/weibo
      - https://unpkg.com/@waline/emojis@1.2.0/alus
    requiredMeta:
      - nick
      - mail
    wordLimit: 0
    pageSize: 10

  # ⭐ 字体加载策略（修复 fonts.gstatic.com ERR_ABORTED）
  #
  # reimu 默认优先级: custom_font > font(Google Fonts) > local_font
  # 之前的问题：font.enable=true → 从 fonts.googleapis.com 拉 Mulish + Noto Serif SC
  #   → CSS 再要求浏览器从 fonts.gstatic.com 下 woff2 字体文件
  #   → 中国境内访问 gstatic 极不稳定（GFW RST / 404 / ERR_ABORTED）
  #
  # 处置：关闭 font.enable，跳过 Google Fonts 请求，直接走 local_font 系统字体链
  #       （Linux/macOS/Windows/iOS/Android 都自带中文字体，0 网络请求、立即渲染）
  # 若以后需要漂亮字体 + 稳定加载：改成 custom_font，CSS 指向国内 CDN 或 static/fonts/ 本地
  font:
    enable: false
    article: []
    code: []
  local_font:
    article:
      - "-apple-system"
      - "BlinkMacSystemFont"
      - "PingFang SC"
      - "HarmonyOS Sans SC"
      - "Hiragino Sans GB"
      - "Microsoft YaHei"
      - "Source Han Sans SC"
      - "Noto Sans CJK SC"
      - "WenQuanYi Micro Hei"
      - sans-serif
    code:
      - "JetBrains Mono"
      - "Fira Code"
      - "Source Code Pro"
      - Menlo
      - Monaco
      - Consolas
      - "Liberation Mono"
      - "Courier New"
      - monospace
  
# Markdown渲染配置
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    endLevel: 4
    ordered: true
    startLevel: 2
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNoStart: 1
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4